<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mintows Remote Browser v0.46</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif;background:#202124;color:#fff}
#bar{height:58px;display:flex;gap:6px;align-items:center;padding:8px;background:#303134;flex-wrap:nowrap}button,select{font:inherit;border:0;border-radius:8px;padding:8px 11px;cursor:pointer;background:#f1f3f4;color:#202124}button:active{transform:translateY(1px)}#url{flex:1;min-width:120px;border:1px solid #5f6368;background:#202124;color:#fff;border-radius:20px;padding:9px 14px;outline:none}#url:focus{border-color:#8ab4f8}#tabs{max-width:190px;min-width:90px}.small{padding:8px 9px}.badge{font-size:12px;color:#bdc1c6;white-space:nowrap}.shield{color:#9aa0a6}.shield.on{color:#81c995}.shield.bad{color:#f28b82}
#stage{position:absolute;left:0;right:0;top:58px;bottom:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#111}#screen{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;background:#111}
#imeProxy{position:fixed;width:2px;height:2px;opacity:.01;left:0;top:60px;border:0;padding:0;outline:0;background:transparent;color:transparent;caret-color:transparent}#imeHint{position:fixed;display:none;left:12px;bottom:44px;max-width:70vw;background:rgba(0,0,0,.78);padding:7px 10px;border-radius:7px;font-size:13px;color:#fff;z-index:4}#hint{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.65);padding:7px 10px;border-radius:7px;font-size:12px;color:#ddd;z-index:3}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:20}#gateCard{width:min(420px,90vw);background:#303134;border:1px solid #5f6368;border-radius:16px;padding:24px;box-shadow:0 12px 40px #000}#gateCard h2{margin:0 0 8px}#gateCard p{color:#bdc1c6;margin:0 0 16px}#gatePass{width:100%;padding:12px;border-radius:10px;border:1px solid #5f6368;background:#202124;color:#fff;outline:none}#gateErr{color:#f28b82;font-size:12px;margin:8px 0;min-height:16px}#gateBtn{width:100%}
#filePicker{display:none}#uploadBox{position:fixed;right:12px;bottom:44px;background:#303134;border:1px solid #5f6368;border-radius:10px;padding:10px;display:none;z-index:10;max-width:360px}.progress{height:6px;background:#5f6368;border-radius:3px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;width:0;background:#8ab4f8}
</style></head><body>
<div id="bar"><button id="back" class="small">←</button><button id="forward" class="small">→</button><button id="reload" class="small">↻</button><button id="newTab" class="small">＋</button><button id="closeTab" class="small">×</button><input id="url" value="https://www.google.com/" autocomplete="off" spellcheck="false"><button id="go">移動</button><select id="tabs"></select><button id="downloads" class="small">📥</button><span id="shield" class="badge shield">🛡️ 0</span><span id="status" class="badge">接続中…</span></div>
<div id="stage"><video id="screen" autoplay playsinline></video></div><textarea id="imeProxy" aria-label="日本語入力用" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea><input id="filePicker" type="file"><div id="uploadBox"><div id="uploadText">ファイル転送</div><button id="chooseFile" style="display:none;margin-top:8px">ファイルを選択</button><div class="progress"><i id="uploadBar"></i></div></div><div id="imeHint"></div><div id="hint">🔐 WebRTC · 1920基準 · 30fps · リモートタブ操作 · 日本語IME · ファイル転送</div>
<div id="gate"><div id="gateCard"><h2>🔐 mintows Browser</h2><p>ゲートパスワードを入力してください</p><input id="gatePass" type="password" autocomplete="current-password"><div id="gateErr"></div><button id="gateBtn">接続</button></div></div>
<script>
const screen=document.getElementById('screen'),stage=document.getElementById('stage'),url=document.getElementById('url'),status=document.getElementById('status'),tabsEl=document.getElementById('tabs'),shieldEl=document.getElementById('shield'),imeProxy=document.getElementById('imeProxy'),imeHint=document.getElementById('imeHint'),gate=document.getElementById('gate'),gatePass=document.getElementById('gatePass'),gateBtn=document.getElementById('gateBtn'),gateErr=document.getElementById('gateErr'),filePicker=document.getElementById('filePicker'),uploadBox=document.getElementById('uploadBox'),uploadText=document.getElementById('uploadText'),uploadBar=document.getElementById('uploadBar'),chooseFile=document.getElementById('chooseFile');
let ws=null,authed=false,gatePassword='',clientId='',selectedTabId=null,info={width:1920,height:1080},composing=false,lastMove=0,pc=null,dc=null,remoteStream=null,pendingCandidates=[],remoteDescriptionReady=false;
const RTC_CONFIG={iceTransportPolicy:'all',iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:openrelay.metered.ca:80'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},{urls:'turns:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v,f){const n=Number(v);return Number.isFinite(n)&&n>0?n:f}
function setState(s){if(!s||typeof s!=='object')return;info={...info,...s,width:num(s.width,info.width),height:num(s.height,info.height)};if(s.activeTabId!=null)selectedTabId=Number(s.activeTabId)||selectedTabId;if(s.url&&document.activeElement!==url)url.value=String(s.url);const list=Array.isArray(s.tabs)?s.tabs:[];tabsEl.innerHTML=list.map(t=>`<option value="${t.id}" ${Number(t.id)===Number(selectedTabId)?'selected':''}>${esc(t.title||'新しいタブ')}</option>`).join('');const t=list.find(x=>Number(x.id)===Number(selectedTabId))||list[0];if(t){selectedTabId=t.id;tabsEl.value=String(selectedTabId);const sh=t.shield||{};shieldEl.textContent=`🛡️ ${Number(sh.ads||0)+Number(sh.trackers||0)}`;shieldEl.className='badge shield'+(sh.enabled?' on':' bad')}status.textContent=pc?.connectionState==='connected'?`WebRTC接続 · ${info.width}×${info.height}`:`WSS接続 · WebRTC待機`}
function focusIme(x,y){imeProxy.style.left=Math.max(0,Math.round(x))+'px';imeProxy.style.top=Math.max(0,Math.round(y))+'px';imeProxy.focus({preventScroll:true})}function showIme(t){imeHint.textContent=t?`入力中: ${t}`:'';imeHint.style.display=t?'block':'none'}
function sendWS(d){if(ws&&ws.readyState===WebSocket.OPEN&&authed){try{ws.send(JSON.stringify(d))}catch{}}}
function sendInput(d){if(dc&&dc.readyState==='open'){try{dc.send(JSON.stringify(d));return true}catch{}}sendWS(d);return false}
function pos(e){const r=screen.getBoundingClientRect();if(!r.width||!r.height)return{x:0,y:0};return{x:(e.clientX-r.left)*(info.width/r.width),y:(e.clientY-r.top)*(info.height/r.height)}}function navigate(){sendInput({type:'navigate',url:url.value,tabId:selectedTabId})}
function showDownloads(){const ds=Array.isArray(info.downloads)?info.downloads.filter(x=>x.state==='completed'&&x.path):[];if(!ds.length){alert('リモートで受け取れる完了済みダウンロードはありません');return}const text=ds.map((d,i)=>`${i+1}: ${d.filename} (${d.total||d.received||0} bytes)`).join('\n');const v=prompt('受け取るファイル番号を入力\n\n'+text);const i=Number(v)-1;if(Number.isInteger(i)&&ds[i])sendWS({type:'download-file',id:ds[i].id,tabId:selectedTabId})}
function createPeer(){if(pc){try{pc.close()}catch{}}pendingCandidates=[];remoteDescriptionReady=false;remoteStream=new MediaStream();screen.srcObject=remoteStream;pc=new RTCPeerConnection(RTC_CONFIG);pc.onicecandidate=e=>{if(e.candidate)sendWS({type:'webrtc-signal',data:{kind:'candidate',candidate:e.candidate}})};pc.ontrack=e=>{if(!remoteStream){remoteStream=new MediaStream()}remoteStream.addTrack(e.track);screen.srcObject=remoteStream;screen.play().catch(()=>{});const st=e.track.getSettings?.()||{};if(st.width)info.width=st.width;if(st.height)info.height=st.height;status.textContent=`WebRTC接続 · ${info.width}×${info.height}`};pc.onicecandidateerror=e=>{status.textContent=`ICEエラー ${e.errorCode||''} ${e.errorText||''}`;};pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='connected'||pc.iceConnectionState==='completed')status.textContent=`WebRTC接続 · ${info.width}×${info.height}`;else status.textContent=`ICE ${pc.iceConnectionState}`};pc.onconnectionstatechange=()=>{status.textContent=`WebRTC ${pc.connectionState}${info.width?' · '+info.width+'×'+info.height:''}`;if(pc.connectionState==='connected'){setTimeout(async()=>{try{const st=await pc.getStats();for(const r of st){if(r.type==='candidate-pair'&&r.state==='succeeded'&&(r.nominated||r.selected)){status.textContent=`WebRTC接続 · ${info.width}×${info.height} · ${r.protocol||'ICE'}`;break}}}catch{}},500)}if(pc.connectionState==='failed'){sendWS({type:'webrtc-signal',data:{kind:'restart'}})}};dc=pc.createDataChannel('input',{ordered:true});dc.onopen=()=>{status.textContent=`WebRTC接続 · ${info.width}×${info.height}`};dc.onclose=()=>{};return pc}
async function startWebRTC(){if(!authed||!clientId)return;const p=createPeer();const offer=await p.createOffer({offerToReceiveVideo:true,offerToReceiveAudio:true});await p.setLocalDescription(offer);sendWS({type:'webrtc-signal',data:{kind:'offer',description:p.localDescription}});status.textContent='WebRTC接続中…'}
async function handleSignal(data){if(!data)return;if(data.kind==='answer'){try{await pc?.setRemoteDescription(data.description);remoteDescriptionReady=true;const q=pendingCandidates.splice(0);for(const c of q){try{await pc?.addIceCandidate(c)}catch{}}}catch(e){status.textContent='WebRTC answer error: '+(e.message||e)}}else if(data.kind==='candidate'){if(!remoteDescriptionReady)pendingCandidates.push(data.candidate);else{try{await pc?.addIceCandidate(data.candidate)}catch{}}}else if(data.kind==='error'){status.textContent='WebRTCエラー: '+(data.error||'unknown')}}
function handleMessage(m){if(m.type==='auth-ok'){authed=true;clientId=m.clientId||'';gate.style.display='none';gateErr.textContent='';if(m.state)setState(m.state);startWebRTC().catch(e=>{status.textContent='WebRTC開始失敗: '+e.message});return}if(m.type==='auth-error'){authed=false;gate.style.display='flex';gateErr.textContent=m.error||'認証に失敗しました';return}if(m.state)setState(m.state);if(m.type==='webrtc-signal'){handleSignal(m.data);return}if(m.type==='file-chooser'){filePicker.multiple=m.mode==='selectMultiple';filePicker.value='';uploadBox.style.display='block';chooseFile.style.display='inline-block';uploadText.textContent='Windows側のページがファイルを要求しています';uploadBar.style.width='0%';return}if(m.type==='file-upload-progress'){uploadBox.style.display='block';uploadText.textContent=`アップロード: ${m.name||''} ${m.received||0}/${m.total||0}`;uploadBar.style.width=(m.total?Math.min(100,(m.received/m.total)*100):0)+'%';return}if(m.type==='file-uploaded'){uploadText.textContent=`アップロード完了: ${m.name||''}`;setTimeout(()=>uploadBox.style.display='none',1200);return}if(m.type==='file-upload-error'){uploadText.textContent='アップロード失敗: '+(m.error||'unknown');setTimeout(()=>uploadBox.style.display='none',2500);return}if(m.type==='file-download-start'){window._dl={id:m.id,name:m.name||'download',size:m.size||0,chunks:[]};uploadBox.style.display='block';uploadText.textContent=`ダウンロード受信: ${m.name||''}`;uploadBar.style.width='0%';return}if(m.type==='file-download-chunk'&&window._dl){window._dl.chunks.push(m.data);return}if(m.type==='file-download-end'&&window._dl){const d=window._dl;const bin=atob(d.chunks.join(''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u]));a.download=d.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);window._dl=null;uploadText.textContent=`ダウンロード完了: ${d.name}`;setTimeout(()=>uploadBox.style.display='none',1200)}}
function connect(){if(ws&&[WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState))return;const proto=location.protocol==='https:'?'wss:':'ws:';const sock=new WebSocket(proto+'//'+location.host+'/ws');ws=sock;sock.onopen=()=>{status.textContent='WSS認証中…';sock.send(JSON.stringify({type:'auth',role:'client',password:gatePassword}))};sock.onclose=()=>{authed=false;if(ws===sock)ws=null;try{pc?.close()}catch{};pc=null;dc=null;status.textContent='再接続待機…';setTimeout(connect,1000)};sock.onerror=()=>{status.textContent='WSS接続エラー'};sock.onmessage=e=>{try{handleMessage(JSON.parse(e.data))}catch{}}}
function sendKey(e){const mods=[];if(e.ctrlKey)mods.push('control');if(e.metaKey)mods.push('command');if(e.altKey)mods.push('alt');if(e.shiftKey)mods.push('shift');sendInput({type:'key',key:e.key,modifiers:mods,tabId:selectedTabId})}
imeProxy.addEventListener('compositionstart',e=>{composing=true;showIme(e.data||'');sendInput({type:'ime',phase:'start',text:e.data||'',tabId:selectedTabId})});imeProxy.addEventListener('compositionupdate',e=>{showIme(e.data||'');sendInput({type:'ime',phase:'update',text:e.data||'',tabId:selectedTabId})});imeProxy.addEventListener('compositionend',e=>{composing=false;showIme('');sendInput({type:'ime',phase:'end',text:e.data||'',tabId:selectedTabId})});imeProxy.addEventListener('input',e=>{if(!composing&&e.data)sendInput({type:'text',text:e.data,tabId:selectedTabId});imeProxy.value=''});
document.addEventListener('keydown',e=>{if(e.target===gatePass||e.target===url)return;if(e.isComposing||composing)return;const k=String(e.key||'');if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){sendInput({type:'text',text:k,tabId:selectedTabId});e.preventDefault();if(e.target===imeProxy)imeProxy.value='';return}if(e.ctrlKey||e.metaKey||e.altKey||k.length>1){sendKey(e);e.preventDefault()}},true);
screen.addEventListener('mousedown',e=>{const p=pos(e);focusIme(e.clientX,e.clientY);sendInput({type:'mouse',action:'mouseDown',x:p.x,y:p.y,button:e.button===2?'right':e.button===1?'middle':'left',clickCount:e.detail||1,tabId:selectedTabId});e.preventDefault()});screen.addEventListener('mouseup',e=>{const p=pos(e);sendInput({type:'mouse',action:'mouseUp',x:p.x,y:p.y,button:e.button===2?'right':e.button===1?'middle':'left',clickCount:e.detail||1,tabId:selectedTabId});e.preventDefault()});screen.addEventListener('mousemove',e=>{const now=performance.now();if(now-lastMove<20)return;lastMove=now;const p=pos(e);sendInput({type:'mouse',action:'mouseMove',x:p.x,y:p.y,tabId:selectedTabId})});screen.addEventListener('wheel',e=>{const p=pos(e);sendInput({type:'wheel',x:p.x,y:p.y,deltaX:e.deltaX,deltaY:e.deltaY,tabId:selectedTabId});e.preventDefault()},{passive:false});screen.addEventListener('contextmenu',e=>e.preventDefault());
tabsEl.addEventListener('change',()=>{selectedTabId=Number(tabsEl.value)||null;sendInput({type:'setRemoteTarget',tabId:selectedTabId})});document.getElementById('newTab').onclick=()=>sendInput({type:'tab',action:'new'});document.getElementById('closeTab').onclick=()=>{if(selectedTabId!=null)sendInput({type:'tab',action:'close',id:selectedTabId})};document.getElementById('back').onclick=()=>sendInput({type:'back',tabId:selectedTabId});document.getElementById('forward').onclick=()=>sendInput({type:'forward',tabId:selectedTabId});document.getElementById('reload').onclick=()=>sendInput({type:'reload',tabId:selectedTabId});document.getElementById('go').onclick=navigate;url.addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});
chooseFile.onclick=()=>filePicker.click();filePicker.addEventListener('change',async()=>{const files=[...filePicker.files];if(!files.length)return;chooseFile.style.display='none';const file=files[0];const max=50*1024*1024;if(file.size>max){alert('50MBを超えるファイルは送信できません');return}sendWS({type:'file-upload-start',name:file.name,size:file.size,tabId:selectedTabId});const chunk=256*1024;uploadBox.style.display='block';for(let off=0;off<file.size;off+=chunk){const buf=await file.slice(off,Math.min(file.size,off+chunk)).arrayBuffer();let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));sendWS({type:'file-upload-chunk',data:btoa(s),tabId:selectedTabId});uploadBar.style.width=Math.min(100,((off+b.length)/file.size)*100)+'%';uploadText.textContent=`アップロード: ${file.name} ${off+b.length}/${file.size}`;await new Promise(r=>setTimeout(r,0))}sendWS({type:'file-upload-end',tabId:selectedTabId});filePicker.value=''});
document.getElementById('downloads').onclick=showDownloads;shieldEl.onclick=()=>sendInput({type:'shield-toggle',tabId:selectedTabId});gatePass.addEventListener('keydown',e=>{if(e.key==='Enter')gateBtn.click()});gateBtn.onclick=()=>{gatePassword=gatePass.value.trim();gateErr.textContent='';connect()};connect();
</script></body></html>

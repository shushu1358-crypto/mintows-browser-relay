<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mintows Remote Browser</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif;background:#202124;color:#fff}#bar{height:58px;display:flex;gap:6px;align-items:center;padding:8px;background:#303134}button,input,select{font:inherit}button,select{border:0;border-radius:8px;padding:8px 12px;cursor:pointer}#url{flex:1;border:1px solid #5f6368;background:#202124;color:#fff;border-radius:20px;padding:9px 14px;outline:none}#status{font-size:12px;color:#bdc1c6;min-width:150px;text-align:right}#stage{position:absolute;left:0;right:0;top:58px;bottom:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:#111}#remoteAudio{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}#screen{display:block;max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 1px #444;user-select:none;-webkit-user-drag:none}#hint{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.65);padding:7px 10px;border-radius:7px;font-size:12px;color:#ddd}#lock{font-size:18px}</style></head>
<body><div id="bar"><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><span id="lock">🔒</span><input id="url" value="https://www.google.com/"><button id="go">移動</button><select id="tabs" title="操作対象タブ"></select><span id="status">WSS接続中…</span></div><div id="stage"><canvas id="screen"></canvas></div><audio id="remoteAudio" autoplay></audio><div id="hint">🔐 ゲートパスワード認証 · WSSでWindows上のmintows Browserを遠隔操作</div><div id="gate" style="position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:20"><div style="width:min(420px,90vw);background:#303134;border:1px solid #5f6368;border-radius:16px;padding:24px;box-shadow:0 12px 40px #000"><h2 style="margin:0 0 8px">🔐 mintows Browser</h2><p style="color:#bdc1c6;margin:0 0 16px">ゲートパスワードを入力してください</p><input id="gatePass" type="password" autocomplete="current-password" style="width:100%;padding:12px;border-radius:10px;border:1px solid #5f6368;background:#202124;color:#fff;outline:none"><div id="gateErr" style="color:#f28b82;font-size:12px;margin:8px 0;min-height:16px"></div><button id="gateBtn" style="width:100%">接続</button></div></div>
<script>
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),url=document.getElementById('url'),status=document.getElementById('status'),tabsEl=document.getElementById('tabs');let info={width:1,height:1},selectedTabId=null,ws=null,img=null,gatePassword=sessionStorage.getItem('mintowsGatePassword')||'',authed=false;let audioEl=document.getElementById('remoteAudio'),audioQueue=[],audioSource=null,audioBusy=false,audioMime='audio/webm;codecs=opus';
function setState(s){if(!s)return;info=s;if(s.url&&document.activeElement!==url)url.value=s.url;selectedTabId=Number(s.activeTabId)||selectedTabId;tabsEl.innerHTML=(s.tabs||[]).map(t=>`<option value="${t.id}" ${Number(t.id)===selectedTabId?'selected':''}>${escapeHtml(t.title||'新しいタブ')}</option>`).join('');status.textContent=`WSS接続 · ${s.width}×${s.height}`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function playAudioChunk(base64){
  try{
    if(!audioSource){
      if(!('MediaSource' in window)) return;
      audioSource=new MediaSource();
      audioEl.src=URL.createObjectURL(audioSource);
      audioSource.addEventListener('sourceopen',()=>flushAudio(),{once:false});
    }
    audioQueue.push(base64);
    flushAudio();
  }catch(_){}
}
async function flushAudio(){
  if(!audioSource||audioSource.readyState!==1||audioBusy||!audioQueue.length)return;
  if(!audioSource.sourceBuffers.length){
    try{if(!MediaSource.isTypeSupported(audioMime))audioMime='audio/webm';audioSource.addSourceBuffer(audioMime);}catch(_){return;}
  }
  const sb=audioSource.sourceBuffers[0];
  if(sb.updating)return;
  const b64=audioQueue.shift();
  try{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);audioBusy=true;sb.addEventListener('updateend',()=>{audioBusy=false;flushAudio();},{once:true});sb.appendBuffer(u.buffer);audioEl.play().catch(()=>{});}catch(_){audioBusy=false;}
}

function connect(){const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(proto+'//'+location.host+'/ws');ws.onopen=()=>{status.textContent='WSS認証中…';ws.send(JSON.stringify({type:'auth',role:'client',password:gatePassword}));};ws.onclose=()=>{authed=false;let audioEl=document.getElementById('remoteAudio'),audioQueue=[],audioSource=null,audioBusy=false,audioMime='audio/webm;codecs=opus';status.textContent='再接続待機…';setTimeout(connect,1000)};ws.onerror=()=>status.textContent='WSS接続エラー';ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='auth-ok'){authed=true;document.getElementById('gate').style.display='none';status.textContent='WSS接続済み';return}if(m.type==='auth-error'){authed=false;let audioEl=document.getElementById('remoteAudio'),audioQueue=[],audioSource=null,audioBusy=false,audioMime='audio/webm;codecs=opus';document.getElementById('gate').style.display='flex';document.getElementById('gateErr').textContent=m.error||'認証に失敗しました';return}if(m.state)setState(m.state);if(m.type==='audio'&&m.data){playAudioChunk(m.data);return}if(m.type==='frame'&&m.image){setState(m.state);const im=new Image();im.onload=()=>{canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;canvas.style.width=Math.min(stage.clientWidth,im.naturalWidth)+'px';canvas.style.height='auto';ctx.drawImage(im,0,0);};im.src='data:image/jpeg;base64,'+m.image;}}catch(_){}}}
function send(d){if(ws&&ws.readyState===1&&authed)ws.send(JSON.stringify(d))}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}}
tabsEl.addEventListener('change',()=>{selectedTabId=Number(tabsEl.value)||null;send({type:'setRemoteTarget',tabId:selectedTabId})});
canvas.addEventListener('mousedown',e=>{const p=pos(e);send({type:'mouse',action:'mouseDown',x:p.x,y:p.y,button:e.button===2?'right':'left',clickCount:e.detail||1});e.preventDefault()});canvas.addEventListener('mouseup',e=>{const p=pos(e);send({type:'mouse',action:'mouseUp',x:p.x,y:p.y,button:e.button===2?'right':'left',clickCount:e.detail||1});e.preventDefault()});canvas.addEventListener('mousemove',e=>{const p=pos(e);send({type:'mouse',action:'mouseMove',x:p.x,y:p.y})});canvas.addEventListener('wheel',e=>{const p=pos(e);send({type:'wheel',x:p.x,y:p.y,deltaX:e.deltaX,deltaY:e.deltaY});e.preventDefault()},{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(document.activeElement===url||document.activeElement===document.getElementById('gatePass'))return;const mods=[];if(e.ctrlKey)mods.push('control');if(e.altKey)mods.push('alt');if(e.shiftKey)mods.push('shift');if(e.metaKey)mods.push('command');send({type:'key',key:e.key,modifiers:mods});if(e.key.length===1||['Enter','Backspace','Tab','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End','PageUp','PageDown','Delete',' ','F5'].includes(e.key))e.preventDefault()});
function navigate(){send({type:'navigate',url:url.value,tabId:selectedTabId})}document.getElementById('go').onclick=navigate;url.addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});document.getElementById('back').onclick=()=>send({type:'back',tabId:selectedTabId});document.getElementById('forward').onclick=()=>send({type:'forward',tabId:selectedTabId});document.getElementById('reload').onclick=()=>send({type:'reload',tabId:selectedTabId});document.getElementById('gatePass').value=gatePassword;document.getElementById('gateBtn').onclick=()=>{gatePassword=document.getElementById('gatePass').value.trim();sessionStorage.setItem('mintowsGatePassword',gatePassword);document.getElementById('gateErr').textContent='';if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'auth',role:'client',password:gatePassword}));else connect()};document.getElementById('gatePass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('gateBtn').click()});window.addEventListener('resize',()=>{if(canvas.width){canvas.style.width=Math.min(stage.clientWidth,canvas.width)+'px'}});connect();
</script></body></html>

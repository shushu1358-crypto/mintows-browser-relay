<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mintows Remote Browser v0.36</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif;background:#202124;color:#fff}
#bar{height:58px;display:flex;gap:6px;align-items:center;padding:8px;background:#303134;flex-wrap:nowrap}
button,select{font:inherit;border:0;border-radius:8px;padding:8px 11px;cursor:pointer;background:#f1f3f4;color:#202124}button:active{transform:translateY(1px)}
#url{flex:1;min-width:120px;border:1px solid #5f6368;background:#202124;color:#fff;border-radius:20px;padding:9px 14px;outline:none}#url:focus{border-color:#8ab4f8}
#tabs{max-width:190px;min-width:90px}.small{padding:8px 9px}.badge{font-size:12px;color:#bdc1c6;white-space:nowrap}.shield{color:#9aa0a6}.shield.on{color:#81c995}.shield.bad{color:#f28b82}
#stage{position:absolute;left:0;right:0;top:58px;bottom:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:#111}
#screen{display:block;max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 1px #444;user-select:none;-webkit-user-drag:none}
#remoteAudio{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
#imeProxy{position:fixed;width:2px;height:2px;opacity:.01;left:0;top:60px;border:0;padding:0;outline:0;background:transparent;color:transparent;caret-color:transparent}
#imeHint{position:fixed;display:none;left:12px;bottom:44px;max-width:70vw;background:rgba(0,0,0,.78);padding:7px 10px;border-radius:7px;font-size:13px;color:#fff;z-index:4}
#hint{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.65);padding:7px 10px;border-radius:7px;font-size:12px;color:#ddd;z-index:3}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:20}#gateCard{width:min(420px,90vw);background:#303134;border:1px solid #5f6368;border-radius:16px;padding:24px;box-shadow:0 12px 40px #000}#gateCard h2{margin:0 0 8px}#gateCard p{color:#bdc1c6;margin:0 0 16px}#gatePass{width:100%;padding:12px;border-radius:10px;border:1px solid #5f6368;background:#202124;color:#fff;outline:none}#gateErr{color:#f28b82;font-size:12px;margin:8px 0;min-height:16px}#gateBtn{width:100%}
#filePicker{display:none}#uploadBox{position:fixed;right:12px;bottom:44px;background:#303134;border:1px solid #5f6368;border-radius:10px;padding:10px;display:none;z-index:10;max-width:360px}.progress{height:6px;background:#5f6368;border-radius:3px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;width:0;background:#8ab4f8}
</style>
</head>
<body>
<div id="bar">
  <button id="back" class="small">←</button><button id="forward" class="small">→</button><button id="reload" class="small">↻</button>
  <button id="newTab" class="small" title="リモート側で新しいタブ">＋</button><button id="closeTab" class="small" title="選択中のタブを閉じる">×</button>
  <input id="url" value="https://www.google.com/" autocomplete="off" spellcheck="false">
  <button id="go">移動</button><select id="tabs" title="操作対象タブ"></select><button id="downloads" class="small" title="ダウンロード">📥</button>
  <span id="shield" class="badge shield">🛡️ 0</span><span id="status" class="badge">接続中…</span>
</div>
<div id="stage"><canvas id="screen"></canvas></div>
<audio id="remoteAudio" autoplay></audio>
<textarea id="imeProxy" aria-label="日本語入力用" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<input id="filePicker" type="file">
<div id="uploadBox"><div id="uploadText">ファイル転送</div><button id="chooseFile" style="display:none;margin-top:8px">ファイルを選択</button><div class="progress"><i id="uploadBar"></i></div></div>
<div id="imeHint"></div><div id="hint">🔐 WSS · 30fps adaptive · リモートタブ操作 · 日本語IME · ファイル転送</div>
<div id="gate"><div id="gateCard"><h2>🔐 mintows Browser</h2><p>ゲートパスワードを入力してください</p><input id="gatePass" type="password" autocomplete="current-password"><div id="gateErr"></div><button id="gateBtn">接続</button></div></div>
<script>
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),url=document.getElementById('url'),status=document.getElementById('status'),tabsEl=document.getElementById('tabs'),shieldEl=document.getElementById('shield'),imeProxy=document.getElementById('imeProxy'),imeHint=document.getElementById('imeHint'),gate=document.getElementById('gate'),gatePass=document.getElementById('gatePass'),gateBtn=document.getElementById('gateBtn'),gateErr=document.getElementById('gateErr'),filePicker=document.getElementById('filePicker'),uploadBox=document.getElementById('uploadBox'),uploadText=document.getElementById('uploadText'),uploadBar=document.getElementById('uploadBar');
const audioEl=document.getElementById('remoteAudio'),chooseFile=document.getElementById('chooseFile');
let ws=null,authed=false,gatePassword='',selectedTabId=null,lastSeq=0,info={width:1,height:1},composing=false,lastMove=0;
let audioQueue=[],audioSource=null,audioBusy=false,audioMime='audio/webm;codecs=opus';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v,f){const n=Number(v);return Number.isFinite(n)&&n>0?n:f}
function setState(s){
  if(!s||typeof s!=='object')return;
  info={...info,...s,width:num(s.width,info.width),height:num(s.height,info.height)};
  if(s.activeTabId!=null) selectedTabId=Number(s.activeTabId)||selectedTabId;
  if(s.url&&document.activeElement!==url) url.value=String(s.url);
  const list=Array.isArray(s.tabs)?s.tabs:[];
  tabsEl.innerHTML=list.map(t=>`<option value="${t.id}" ${Number(t.id)===selectedTabId?'selected':''}>${esc(t.title||'新しいタブ')}</option>`).join('');
  const t=list.find(x=>Number(x.id)===Number(selectedTabId))||list[0];
  if(t){selectedTabId=t.id;tabsEl.value=String(selectedTabId);const sh=t.shield||{};shieldEl.textContent=`🛡️ ${Number(sh.ads||0)+Number(sh.trackers||0)}`;shieldEl.className='badge shield'+(sh.enabled?' on':' bad')}
  const chooser=t?.fileChooser;
  if(chooser?.pending){filePicker.multiple=chooser.mode==='selectMultiple';}
  status.textContent=`WSS接続 · ${info.width}×${info.height}`;
}
function focusIme(x,y){imeProxy.style.left=Math.max(0,Math.round(x))+'px';imeProxy.style.top=Math.max(0,Math.round(y))+'px';imeProxy.focus({preventScroll:true})}
function showIme(t){imeHint.textContent=t?`入力中: ${t}`:'';imeHint.style.display=t?'block':'none'}
function send(d){if(ws&&ws.readyState===WebSocket.OPEN&&authed){try{ws.send(JSON.stringify(d))}catch{}}}
function pos(e){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return{x:0,y:0};return{x:(e.clientX-r.left)*(info.width/r.width),y:(e.clientY-r.top)*(info.height/r.height)}}
function navigate(){send({type:'navigate',url:url.value,tabId:selectedTabId})}
function showDownloads(){const ds=Array.isArray(info.downloads)?info.downloads.filter(x=>x.state==='completed'&&x.path):[];if(!ds.length){alert('リモートで受け取れる完了済みダウンロードはありません');return}const text=ds.map((d,i)=>`${i+1}: ${d.filename} (${d.total||d.received||0} bytes)`).join('\n');const v=prompt('受け取るファイル番号を入力\n\n'+text);const i=Number(v)-1;if(Number.isInteger(i)&&ds[i])send({type:'download-file',id:ds[i].id,tabId:selectedTabId})}
function resetAudio(){audioQueue=[];audioBusy=false;audioSource=null;audioMime='audio/webm;codecs=opus';try{audioEl.removeAttribute('src');audioEl.load()}catch{}}
async function playAudioChunk(b64){try{if(!audioSource){if(!('MediaSource'in window))return;audioSource=new MediaSource();audioEl.src=URL.createObjectURL(audioSource);audioSource.addEventListener('sourceopen',flushAudio)}audioQueue.push(b64);if(audioQueue.length>12)audioQueue.splice(0,audioQueue.length-12);flushAudio()}catch{}}
function flushAudio(){if(!audioSource||audioSource.readyState!==1||audioBusy||!audioQueue.length)return;if(!audioSource.sourceBuffers.length){try{if(!MediaSource.isTypeSupported(audioMime))audioMime='audio/webm';audioSource.addSourceBuffer(audioMime)}catch{return}}const sb=audioSource.sourceBuffers[0];if(sb.updating)return;const b64=audioQueue.shift();try{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);audioBusy=true;sb.addEventListener('updateend',()=>{audioBusy=false;flushAudio()},{once:true});sb.appendBuffer(u.buffer);audioEl.play().catch(()=>{})}catch{audioBusy=false}}
function connect(){if(ws&&[WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState))return;const proto=location.protocol==='https:'?'wss:':'ws:';const sock=new WebSocket(proto+'//'+location.host+'/ws');ws=sock;sock.onopen=()=>{status.textContent='WSS認証中…';sock.send(JSON.stringify({type:'auth',role:'client',password:gatePassword}))};sock.onclose=()=>{authed=false;if(ws===sock)ws=null;resetAudio();status.textContent='再接続待機…';setTimeout(connect,1000)};sock.onerror=()=>{status.textContent='WSS接続エラー'};sock.onmessage=e=>{try{const m=JSON.parse(e.data);
  if(m.type==='auth-ok'){authed=true;gate.style.display='none';gateErr.textContent='';if(m.state)setState(m.state);status.textContent='WSS接続済み';return}
  if(m.type==='auth-error'){authed=false;gate.style.display='flex';gateErr.textContent=m.error||'認証に失敗しました';return}
  if(m.state)setState(m.state);
  if(m.type==='audio'&&m.data){playAudioChunk(m.data);return}
  if(m.type==='frame'&&m.image){const seq=Number(m.seq)||0;if(seq&&seq<=lastSeq)return;if(seq)lastSeq=seq;if(m.sourceWidth)m.state&&(info.width=Number(m.sourceWidth)||info.width);if(m.sourceHeight)m.state&&(info.height=Number(m.sourceHeight)||info.height);const im=new Image();im.onload=()=>{canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;canvas.style.width=Math.min(stage.clientWidth,im.naturalWidth)+'px';canvas.style.height='auto';ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);status.textContent=`WSS接続 · ${im.naturalWidth}×${im.naturalHeight} · ${m.fps||30}fps`};im.src='data:image/jpeg;base64,'+m.image;return}
  if(m.type==='file-chooser'){filePicker.multiple=m.mode==='selectMultiple';filePicker.value='';uploadBox.style.display='block';chooseFile.style.display='inline-block';uploadText.textContent='Windows側のページがファイルを要求しています';uploadBar.style.width='0%';return}
  if(m.type==='file-upload-progress'){uploadBox.style.display='block';uploadText.textContent=`アップロード: ${m.name||''} ${m.received||0}/${m.total||0}`;uploadBar.style.width=(m.total?Math.min(100,(m.received/m.total)*100):0)+'%';return}
  if(m.type==='file-uploaded'){uploadText.textContent=`アップロード完了: ${m.name||''}`;setTimeout(()=>uploadBox.style.display='none',1200);return}
  if(m.type==='file-upload-error'){uploadText.textContent='アップロード失敗: '+(m.error||'unknown');setTimeout(()=>uploadBox.style.display='none',2500);return}
  if(m.type==='file-download-start'){window._dl={id:m.id,name:m.name||'download',size:m.size||0,chunks:[]};uploadBox.style.display='block';uploadText.textContent=`ダウンロード受信: ${m.name||''}`;uploadBar.style.width='0%';return}
  if(m.type==='file-download-chunk'&&window._dl){window._dl.chunks.push(m.data);return}
  if(m.type==='file-download-end'&&window._dl){const d=window._dl;const bin=atob(d.chunks.join(''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u]));a.download=d.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);window._dl=null;uploadText.textContent=`ダウンロード完了: ${d.name}`;setTimeout(()=>uploadBox.style.display='none',1200);return}
 }catch{}}}
function sendKey(e){const mods=[];if(e.ctrlKey)mods.push('control');if(e.metaKey)mods.push('command');if(e.altKey)mods.push('alt');if(e.shiftKey)mods.push('shift');send({type:'key',key:e.key,modifiers:mods,tabId:selectedTabId})}
imeProxy.addEventListener('compositionstart',e=>{composing=true;showIme(e.data||'');send({type:'ime',phase:'start',text:e.data||'',tabId:selectedTabId})});imeProxy.addEventListener('compositionupdate',e=>{showIme(e.data||'');send({type:'ime',phase:'update',text:e.data||'',tabId:selectedTabId})});imeProxy.addEventListener('compositionend',e=>{composing=false;showIme('');send({type:'ime',phase:'end',text:e.data||'',tabId:selectedTabId})});imeProxy.addEventListener('input',e=>{if(!composing&&e.data)send({type:'text',text:e.data,tabId:selectedTabId});imeProxy.value=''});imeProxy.addEventListener('keydown',e=>{if(e.isComposing)return;if(e.ctrlKey||e.metaKey||e.altKey||e.key.length>1){sendKey(e);e.preventDefault()}else if(e.key==='Enter'){sendKey(e);e.preventDefault()}});
canvas.addEventListener('mousedown',e=>{const p=pos(e);focusIme(e.clientX,e.clientY);send({type:'mouse',action:'mouseDown',x:p.x,y:p.y,button:e.button===2?'right':e.button===1?'middle':'left',clickCount:e.detail||1,tabId:selectedTabId});e.preventDefault()});canvas.addEventListener('mouseup',e=>{const p=pos(e);send({type:'mouse',action:'mouseUp',x:p.x,y:p.y,button:e.button===2?'right':e.button===1?'middle':'left',clickCount:e.detail||1,tabId:selectedTabId});e.preventDefault()});canvas.addEventListener('mousemove',e=>{const now=performance.now();if(now-lastMove<33)return;lastMove=now;const p=pos(e);send({type:'mouse',action:'mouseMove',x:p.x,y:p.y,tabId:selectedTabId})});canvas.addEventListener('wheel',e=>{const p=pos(e);send({type:'wheel',x:p.x,y:p.y,deltaX:e.deltaX,deltaY:e.deltaY,tabId:selectedTabId});e.preventDefault()},{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
tabsEl.addEventListener('change',()=>{selectedTabId=Number(tabsEl.value)||null;send({type:'setRemoteTarget',tabId:selectedTabId})});
document.getElementById('newTab').onclick=()=>send({type:'tab',action:'new'});document.getElementById('closeTab').onclick=()=>{if(selectedTabId!=null)send({type:'tab',action:'close',id:selectedTabId})};document.getElementById('back').onclick=()=>send({type:'back',tabId:selectedTabId});document.getElementById('forward').onclick=()=>send({type:'forward',tabId:selectedTabId});document.getElementById('reload').onclick=()=>send({type:'reload',tabId:selectedTabId});document.getElementById('go').onclick=navigate;url.addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});
chooseFile.onclick=()=>filePicker.click();filePicker.addEventListener('change',async()=>{const files=[...filePicker.files];if(!files.length)return;chooseFile.style.display='none';const file=files[0];const max=50*1024*1024;if(file.size>max){alert('50MBを超えるファイルは送信できません');return}send({type:'file-upload-start',name:file.name,size:file.size,tabId:selectedTabId});const chunk=256*1024;uploadBox.style.display='block';for(let off=0;off<file.size;off+=chunk){const buf=await file.slice(off,Math.min(file.size,off+chunk)).arrayBuffer();let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));send({type:'file-upload-chunk',data:btoa(s),tabId:selectedTabId});uploadBar.style.width=Math.min(100,((off+b.length)/file.size)*100)+'%';uploadText.textContent=`アップロード: ${file.name} ${off+b.length}/${file.size}`;await new Promise(r=>setTimeout(r,0))}send({type:'file-upload-end',tabId:selectedTabId});filePicker.value=''});
document.getElementById('downloads').onclick=showDownloads;shieldEl.onclick=()=>{send({type:'shield-toggle',tabId:selectedTabId})};gatePass.addEventListener('keydown',e=>{if(e.key==='Enter')gateBtn.click()});gateBtn.onclick=()=>{gatePassword=gatePass.value.trim();gateErr.textContent='';if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'auth',role:'client',password:gatePassword}));else connect()};window.addEventListener('resize',()=>{if(canvas.width)canvas.style.width=Math.min(stage.clientWidth,canvas.width)+'px'});connect();
</script>
</body>
</html>

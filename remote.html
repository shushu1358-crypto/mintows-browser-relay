<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mintows Remote Browser v0.33</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif;background:#202124;color:#fff}
#bar{height:58px;display:flex;gap:6px;align-items:center;padding:8px;background:#303134}button,input,select{font:inherit}button,select{border:0;border-radius:8px;padding:8px 12px;cursor:pointer}#url{flex:1;border:1px solid #5f6368;background:#202124;color:#fff;border-radius:20px;padding:9px 14px;outline:none}#url:focus{border-color:#8ab4f8}#status{font-size:12px;color:#bdc1c6;min-width:150px;text-align:right}#stage{position:absolute;left:0;right:0;top:58px;bottom:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:#111}#remoteAudio{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}#screen{display:block;max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 1px #444;user-select:none;-webkit-user-drag:none}#imeProxy{position:fixed;width:2px;height:2px;opacity:.01;left:0;top:60px;border:0;padding:0;outline:0;background:transparent;color:transparent;z-index:2;caret-color:transparent}#imeHint{position:fixed;display:none;left:12px;bottom:44px;max-width:70vw;background:rgba(0,0,0,.78);padding:7px 10px;border-radius:7px;font-size:13px;color:#fff;z-index:4}#hint{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.65);padding:7px 10px;border-radius:7px;font-size:12px;color:#ddd;z-index:3}#lock{font-size:18px}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:20}#gateCard{width:min(420px,90vw);background:#303134;border:1px solid #5f6368;border-radius:16px;padding:24px;box-shadow:0 12px 40px #000}#gateCard h2{margin:0 0 8px}#gateCard p{color:#bdc1c6;margin:0 0 16px}#gatePass{width:100%;padding:12px;border-radius:10px;border:1px solid #5f6368;background:#202124;color:#fff;outline:none}#gateErr{color:#f28b82;font-size:12px;margin:8px 0;min-height:16px}#gateBtn{width:100%}
</style></head><body>
<div id="bar"><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><span id="lock">🔒</span><input id="url" value="https://www.google.com/" autocomplete="off" spellcheck="false"><button id="go">移動</button><select id="tabs" title="操作対象タブ"></select><span id="status">WSS接続中…</span></div>
<div id="stage"><canvas id="screen"></canvas></div><audio id="remoteAudio" autoplay></audio>
<textarea id="imeProxy" aria-label="日本語入力用" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div id="imeHint"></div><div id="hint">🔐 ゲートパスワード認証 · WSSでWindows上のmintows Browserを遠隔操作 · 日本語IME対応</div>
<div id="gate"><div id="gateCard"><h2>🔐 mintows Browser</h2><p>ゲートパスワードを入力してください</p><input id="gatePass" type="password" autocomplete="current-password"><div id="gateErr"></div><button id="gateBtn">接続</button></div></div>
<script>
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),url=document.getElementById('url'),status=document.getElementById('status'),tabsEl=document.getElementById('tabs'),imeProxy=document.getElementById('imeProxy'),imeHint=document.getElementById('imeHint'),gate=document.getElementById('gate'),gatePass=document.getElementById('gatePass'),gateBtn=document.getElementById('gateBtn'),gateErr=document.getElementById('gateErr');
let info={width:1,height:1},selectedTabId=null,ws=null,authed=false,lastSeq=0,composing=false,imeFocused=false,gatePassword='';
const audioEl=document.getElementById('remoteAudio');let audioQueue=[],audioSource=null,audioBusy=false,audioMime='audio/webm;codecs=opus';
function validNum(v,f){return Number.isFinite(Number(v))&&Number(v)>0?Number(v):f}
function setState(s){if(!s||typeof s!=='object')return;const w=validNum(s.width,info.width||1),h=validNum(s.height,info.height||1);info={...info,...s,width:w,height:h};if(s.url&&document.activeElement!==url)url.value=String(s.url);if(s.activeTabId!=null)selectedTabId=Number(s.activeTabId)||selectedTabId;tabsEl.innerHTML=(Array.isArray(s.tabs)?s.tabs:[]).map(t=>`<option value="${t.id}" ${Number(t.id)===selectedTabId?'selected':''}>${escapeHtml(t.title||'新しいタブ')}</option>`).join('');status.textContent=`WSS接続 · ${w}×${h}`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showIme(text){imeHint.textContent=text?`入力中: ${text}`:'';imeHint.style.display=text?'block':'none'}
function focusIme(x,y){imeFocused=true;imeProxy.style.left=Math.max(0,Math.min(window.innerWidth-4,x||0))+'px';imeProxy.style.top=Math.max(58,Math.min(window.innerHeight-4,y||58))+'px';try{imeProxy.focus({preventScroll:true})}catch(_){imeProxy.focus()}}
function clearIme(){imeProxy.value='';showIme('')}
function sendText(text){if(text)send({type:'text',text,tabId:selectedTabId})}
imeProxy.addEventListener('compositionstart',e=>{composing=true;showIme(e.data||imeProxy.value);send({type:'ime',phase:'start',text:e.data||imeProxy.value,tabId:selectedTabId})});
imeProxy.addEventListener('compositionupdate',e=>{composing=true;showIme(e.data||imeProxy.value);send({type:'ime',phase:'update',text:e.data||imeProxy.value,tabId:selectedTabId})});
imeProxy.addEventListener('compositionend',e=>{const text=e.data||imeProxy.value;composing=false;showIme('');send({type:'ime',phase:'end',text,tabId:selectedTabId});clearIme()});
imeProxy.addEventListener('input',e=>{if(composing)return;const text=imeProxy.value;if(text){sendText(text);clearIme()}});
imeProxy.addEventListener('keydown',e=>{if(composing)return;const control=['Enter','Backspace','Delete','Tab','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End','PageUp','PageDown','F5'];if(control.includes(e.key)||e.ctrlKey||e.altKey||e.metaKey){const mods=[];if(e.ctrlKey)mods.push('control');if(e.altKey)mods.push('alt');if(e.shiftKey)mods.push('shift');if(e.metaKey)mods.push('command');send({type:'key',key:e.key,modifiers:mods,tabId:selectedTabId});e.preventDefault()}});
async function playAudioChunk(base64){try{if(!audioSource){if(!('MediaSource'in window))return;audioSource=new MediaSource();audioEl.src=URL.createObjectURL(audioSource);audioSource.addEventListener('sourceopen',flushAudio)}audioQueue.push(base64);if(audioQueue.length>12)audioQueue.splice(0,audioQueue.length-12);flushAudio()}catch(_) {}}
function flushAudio(){if(!audioSource||audioSource.readyState!==1||audioBusy||!audioQueue.length)return;if(!audioSource.sourceBuffers.length){try{if(!MediaSource.isTypeSupported(audioMime))audioMime='audio/webm';audioSource.addSourceBuffer(audioMime)}catch(_){return}}const sb=audioSource.sourceBuffers[0];if(sb.updating)return;const b64=audioQueue.shift();try{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);audioBusy=true;sb.addEventListener('updateend',()=>{audioBusy=false;flushAudio()},{once:true});sb.appendBuffer(u.buffer);audioEl.play().catch(()=>{})}catch(_){audioBusy=false}}
function resetAudio(){audioQueue=[];audioBusy=false;audioSource=null;audioMime='audio/webm;codecs=opus';try{audioEl.removeAttribute('src');audioEl.load()}catch(_) {}}
function connect(){if(ws&&[WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState))return;const proto=location.protocol==='https:'?'wss:':'ws:';const socket=new WebSocket(proto+'//'+location.host+'/ws');ws=socket;socket.onopen=()=>{status.textContent='WSS認証中…';socket.send(JSON.stringify({type:'auth',role:'client',password:gatePassword}))};socket.onclose=()=>{authed=false;if(ws===socket)ws=null;resetAudio();status.textContent='再接続待機…';setTimeout(connect,1000)};socket.onerror=()=>{status.textContent='WSS接続エラー'};socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='auth-ok'){authed=true;gate.style.display='none';gateErr.textContent='';status.textContent='WSS接続済み';return}if(m.type==='auth-error'){authed=false;gate.style.display='flex';gateErr.textContent=m.error||'認証に失敗しました';return}if(m.state)setState(m.state);if(m.type==='audio'&&m.data){playAudioChunk(m.data);return}if(m.type==='frame'&&m.image){if(Number(m.seq)||0<lastSeq)return;lastSeq=Number(m.seq)||lastSeq;setState(m.state||info);const im=new Image();im.onload=()=>{canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;const w=Math.min(stage.clientWidth,im.naturalWidth);canvas.style.width=Math.max(1,w)+'px';canvas.style.height='auto';ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0)};im.src='data:image/jpeg;base64,'+m.image}}catch(_) {}}}
function send(d){if(ws&&ws.readyState===WebSocket.OPEN&&authed){try{ws.send(JSON.stringify(d))}catch(_){}}}
function pos(e){const r=canvas.getBoundingClientRect();if(!r.width||!r.height||!canvas.width||!canvas.height)return{x:0,y:0};return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}}
let lastMove=0;canvas.addEventListener('mousedown',e=>{const p=pos(e);send({type:'mouse',action:'mouseDown',x:p.x,y:p.y,button:e.button===2?'right':'left',clickCount:e.detail||1,tabId:selectedTabId});focusIme(e.clientX,e.clientY);e.preventDefault()});canvas.addEventListener('mouseup',e=>{const p=pos(e);send({type:'mouse',action:'mouseUp',x:p.x,y:p.y,button:e.button===2?'right':'left',clickCount:e.detail||1,tabId:selectedTabId});e.preventDefault()});canvas.addEventListener('mousemove',e=>{const now=performance.now();if(now-lastMove<33)return;lastMove=now;const p=pos(e);send({type:'mouse',action:'mouseMove',x:p.x,y:p.y,tabId:selectedTabId})});canvas.addEventListener('wheel',e=>{const p=pos(e);send({type:'wheel',x:p.x,y:p.y,deltaX:e.deltaX,deltaY:e.deltaY,tabId:selectedTabId});e.preventDefault()},{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
tabsEl.addEventListener('change',()=>{selectedTabId=Number(tabsEl.value)||null;send({type:'setRemoteTarget',tabId:selectedTabId})});
function navigate(){send({type:'navigate',url:url.value,tabId:selectedTabId})}document.getElementById('go').onclick=navigate;url.addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});document.getElementById('back').onclick=()=>send({type:'back',tabId:selectedTabId});document.getElementById('forward').onclick=()=>send({type:'forward',tabId:selectedTabId});document.getElementById('reload').onclick=()=>send({type:'reload',tabId:selectedTabId});
gatePass.addEventListener('keydown',e=>{if(e.key==='Enter')gateBtn.click()});gateBtn.onclick=()=>{gatePassword=gatePass.value.trim();gateErr.textContent='';if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'auth',role:'client',password:gatePassword}));else connect()};
window.addEventListener('resize',()=>{if(canvas.width)canvas.style.width=Math.min(stage.clientWidth,canvas.width)+'px'});connect();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mintows Remote Browser</title>

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Segoe UI,system-ui,sans-serif;
  background:#202124;
  color:#fff
}

#bar{
  height:58px;
  display:flex;
  gap:6px;
  align-items:center;
  padding:8px;
  background:#303134
}

button,input,select{
  font:inherit
}

button,select{
  border:0;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer
}

#url{
  flex:1;
  border:1px solid #5f6368;
  background:#202124;
  color:#fff;
  border-radius:20px;
  padding:9px 14px;
  outline:none
}

#url:focus{
  border-color:#8ab4f8
}

#status{
  font-size:12px;
  color:#bdc1c6;
  min-width:150px;
  text-align:right
}

#lock{
  font-size:18px
}

#stage{
  position:absolute;
  left:0;
  right:0;
  top:58px;
  bottom:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
  background:#111
}

#screen{
  display:block;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  box-shadow:0 0 0 1px #444;
  user-select:none;
  -webkit-user-drag:none
}

#hint{
  position:absolute;
  left:12px;
  bottom:10px;
  background:rgba(0,0,0,.65);
  padding:7px 10px;
  border-radius:7px;
  font-size:12px;
  color:#ddd
}

#gate{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20
}

#gateCard{
  width:min(420px,90vw);
  background:#303134;
  border:1px solid #5f6368;
  border-radius:16px;
  padding:24px;
  box-shadow:0 12px 40px #000
}

#gateTitle{
  margin:0 0 8px
}

#gateDescription{
  color:#bdc1c6;
  margin:0 0 16px
}

#gatePass{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #5f6368;
  background:#202124;
  color:#fff;
  outline:none
}

#gatePass:focus{
  border-color:#8ab4f8
}

#gateErr{
  color:#f28b82;
  font-size:12px;
  margin:8px 0;
  min-height:16px
}

#gateBtn{
  width:100%
}
</style>
</head>

<body>

<div id="bar">
  <button id="back">←</button>
  <button id="forward">→</button>
  <button id="reload">↻</button>
  <span id="lock">🔒</span>

  <input
    id="url"
    value="https://www.google.com/"
    autocomplete="off"
    spellcheck="false"
  >

  <button id="go">移動</button>

  <select id="tabs" title="操作対象タブ"></select>

  <span id="status">WSS接続中…</span>
</div>

<div id="stage">
  <canvas id="screen"></canvas>
</div>

<div id="hint">
  🔐 ゲートパスワード認証 · WSSでWindows上のmintows Browserを遠隔操作
</div>

<div id="gate">
  <div id="gateCard">

    <h2 id="gateTitle">🔐 mintows Browser</h2>

    <p id="gateDescription">
      ゲートパスワードを入力してください
    </p>

    <input
      id="gatePass"
      type="password"
      autocomplete="current-password"
    >

    <div id="gateErr"></div>

    <button id="gateBtn">
      接続
    </button>

  </div>
</div>

<script>

const canvas=document.getElementById('screen');
const ctx=canvas.getContext('2d');
const stage=document.getElementById('stage');
const url=document.getElementById('url');
const status=document.getElementById('status');
const tabsEl=document.getElementById('tabs');
const gate=document.getElementById('gate');
const gatePass=document.getElementById('gatePass');
const gateBtn=document.getElementById('gateBtn');
const gateErr=document.getElementById('gateErr');

let info={
  width:1,
  height:1
};

let selectedTabId=null;

let ws=null;

let authed=false;

let connecting=false;

let reconnectTimer=null;

let gatePassword=
  sessionStorage.getItem('mintowsGatePassword') || '';

/* =========================
   State
========================= */

function setState(s){

  if(!s)return;

  info=s;

  if(
    s.url &&
    document.activeElement!==url
  ){
    url.value=s.url;
  }

  if(s.activeTabId!==undefined){
    selectedTabId=
      Number(s.activeTabId) ||
      selectedTabId;
  }

  tabsEl.innerHTML=
    (s.tabs||[])
      .map(t=>`
        <option
          value="${t.id}"
          ${Number(t.id)===selectedTabId?'selected':''}
        >
          ${escapeHtml(t.title||'新しいタブ')}
        </option>
      `)
      .join('');

  if(s.width && s.height){
    status.textContent=
      `WSS接続 · ${s.width}×${s.height}`;
  }
}

/* =========================
   HTML escape
========================= */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}

/* =========================
   WebSocket
========================= */

function scheduleReconnect(){

  if(reconnectTimer)return;

  reconnectTimer=setTimeout(()=>{

    reconnectTimer=null;

    connect();

  },1000);

}

function connect(){

  /*
   * すでに接続済み、または接続中なら
   * 二重にWebSocketを作らない。
   */

  if(
    ws &&
    (
      ws.readyState===WebSocket.OPEN ||
      ws.readyState===WebSocket.CONNECTING
    )
  ){
    return;
  }

  if(connecting){
    return;
  }

  connecting=true;

  const proto=
    location.protocol==='https:'
      ? 'wss:'
      : 'ws:';

  const socket=
    new WebSocket(
      proto+'//'+location.host+'/ws'
    );

  ws=socket;

  status.textContent='WSS接続中…';

  socket.onopen=()=>{

    connecting=false;

    /*
     * 接続完了したソケットだけを使う。
     */

    if(ws!==socket){
      try{
        socket.close();
      }catch(_){}
      return;
    }

    status.textContent='WSS認証中…';

    sendAuth(socket);

  };

  socket.onclose=()=>{

    connecting=false;

    if(ws===socket){
      ws=null;
    }

    authed=false;

    status.textContent='再接続待機…';

    scheduleReconnect();

  };

  socket.onerror=()=>{

    connecting=false;

    status.textContent='WSS接続エラー';

  };

  socket.onmessage=e=>{

    try{

      const m=JSON.parse(e.data);

      /* =========================
         Authentication
      ========================= */

      if(m.type==='auth-ok'){

        authed=true;

        gate.style.display='none';

        gateErr.textContent='';

        status.textContent='WSS接続済み';

        return;
      }

      if(m.type==='auth-error'){

        authed=false;

        gate.style.display='flex';

        gateErr.textContent=
          m.error ||
          '認証に失敗しました';

        return;
      }

      /* =========================
         State
      ========================= */

      if(m.state){
        setState(m.state);
      }

      /* =========================
         Frame
      ========================= */

      if(
        m.type==='frame' &&
        m.image
      ){

        setState(m.state);

        const im=new Image();

        im.onload=()=>{

          canvas.width=
            im.naturalWidth;

          canvas.height=
            im.naturalHeight;

          const width=
            Math.min(
              stage.clientWidth,
              im.naturalWidth
            );

          canvas.style.width=
            width+'px';

          canvas.style.height=
            'auto';

          ctx.drawImage(
            im,
            0,
            0
          );

        };

        im.src=
          'data:image/jpeg;base64,'+
          m.image;

      }

    }catch(_){

      /*
       * 壊れたメッセージは無視
       */

    }

  };

}

/* =========================
   Authentication
========================= */

function sendAuth(socket){

  if(
    !socket ||
    socket.readyState!==WebSocket.OPEN
  ){
    return false;
  }

  try{

    socket.send(
      JSON.stringify({
        type:'auth',
        role:'client',
        password:gatePassword
      })
    );

    return true;

  }catch(_){

    return false;

  }

}

/* =========================
   Safe send
========================= */

function send(d){

  /*
   * OPEN状態以外では絶対にsendしない。
   * これで
   * "Failed to execute 'send' on 'WebSocket':
   * CONNECTING state"
   * を防ぐ。
   */

  if(
    !ws ||
    ws.readyState!==WebSocket.OPEN ||
    !authed
  ){
    return false;
  }

  try{

    ws.send(JSON.stringify(d));

    return true;

  }catch(_){

    return false;

  }

}

/* =========================
   Canvas coordinates
========================= */

function pos(e){

  const r=
    canvas.getBoundingClientRect();

  if(
    !r.width ||
    !r.height ||
    !canvas.width ||
    !canvas.height
  ){
    return {
      x:0,
      y:0
    };
  }

  return {
    x:
      (e.clientX-r.left)*
      (canvas.width/r.width),

    y:
      (e.clientY-r.top)*
      (canvas.height/r.height)
  };

}

/* =========================
   Tabs
========================= */

tabsEl.addEventListener(
  'change',
  ()=>{

    selectedTabId=
      Number(tabsEl.value) ||
      null;

    send({
      type:'setRemoteTarget',
      tabId:selectedTabId
    });

  }
);

/* =========================
   Mouse
========================= */

canvas.addEventListener(
  'mousedown',
  e=>{

    const p=pos(e);

    send({
      type:'mouse',
      action:'mouseDown',
      x:p.x,
      y:p.y,
      button:
        e.button===2
          ? 'right'
          : 'left',
      clickCount:
        e.detail || 1
    });

    e.preventDefault();

  }
);

canvas.addEventListener(
  'mouseup',
  e=>{

    const p=pos(e);

    send({
      type:'mouse',
      action:'mouseUp',
      x:p.x,
      y:p.y,
      button:
        e.button===2
          ? 'right'
          : 'left',
      clickCount:
        e.detail || 1
    });

    e.preventDefault();

  }
);

canvas.addEventListener(
  'mousemove',
  e=>{

    const p=pos(e);

    send({
      type:'mouse',
      action:'mouseMove',
      x:p.x,
      y:p.y
    });

  }
);

canvas.addEventListener(
  'wheel',
  e=>{

    const p=pos(e);

    send({
      type:'wheel',
      x:p.x,
      y:p.y,
      deltaX:e.deltaX,
      deltaY:e.deltaY
    });

    e.preventDefault();

  },
  {
    passive:false
  }
);

canvas.addEventListener(
  'contextmenu',
  e=>{
    e.preventDefault();
  }
);

/* =========================
   Keyboard
========================= */

document.addEventListener(
  'keydown',
  e=>{

    /*
     * URL欄とゲートパスワード欄では
     * Windows側へキーを送らない。
     */

    if(
      document.activeElement===url ||
      document.activeElement===gatePass
    ){
      return;
    }

    const mods=[];

    if(e.ctrlKey){
      mods.push('control');
    }

    if(e.altKey){
      mods.push('alt');
    }

    if(e.shiftKey){
      mods.push('shift');
    }

    if(e.metaKey){
      mods.push('command');
    }

    send({
      type:'key',
      key:e.key,
      modifiers:mods
    });

    if(
      e.key.length===1 ||
      [
        'Enter',
        'Backspace',
        'Tab',
        'Escape',
        'ArrowUp',
        'ArrowDown',
        'ArrowLeft',
        'ArrowRight',
        'Home',
        'End',
        'PageUp',
        'PageDown',
        'Delete',
        ' ',
        'F5'
      ].includes(e.key)
    ){
      e.preventDefault();
    }

  }
);

/* =========================
   Navigation
========================= */

function navigate(){

  const target=
    url.value.trim();

  if(!target){
    return;
  }

  send({
    type:'navigate',
    url:target,
    tabId:selectedTabId
  });

}

document.getElementById(
  'go'
).onclick=navigate;

url.addEventListener(
  'keydown',
  e=>{

    if(e.key==='Enter'){
      navigate();
    }

  }
);

document.getElementById(
  'back'
).onclick=()=>{

  send({
    type:'back',
    tabId:selectedTabId
  });

};

document.getElementById(
  'forward'
).onclick=()=>{

  send({
    type:'forward',
    tabId:selectedTabId
  });

};

document.getElementById(
  'reload'
).onclick=()=>{

  send({
    type:'reload',
    tabId:selectedTabId
  });

};

/* =========================
   Gate password
========================= */

gatePass.value=gatePassword;

function authenticate(){

  gatePassword=
    gatePass.value;

  sessionStorage.setItem(
    'mintowsGatePassword',
    gatePassword
  );

  gateErr.textContent='';

  /*
   * OPENなら今のWebSocketで認証。
   */

  if(
    ws &&
    ws.readyState===WebSocket.OPEN
  ){

    sendAuth(ws);

    status.textContent=
      'WSS認証中…';

    return;

  }

  /*
   * CONNECTINGならsendしない。
   * onopen()が最新パスワードで
   * 自動的に認証する。
   */

  if(
    ws &&
    ws.readyState===WebSocket.CONNECTING
  ){

    status.textContent=
      'WSS接続待機中…';

    return;

  }

  /*
   * WebSocketがない場合だけ接続。
   */

  connect();

}

gateBtn.addEventListener(
  'click',
  authenticate
);

gatePass.addEventListener(
  'keydown',
  e=>{

    if(e.key==='Enter'){

      e.preventDefault();

      authenticate();

    }

  }
);

/* =========================
   Resize
========================= */

window.addEventListener(
  'resize',
  ()=>{

    if(canvas.width){

      canvas.style.width=
        Math.min(
          stage.clientWidth,
          canvas.width
        )+'px';

    }

  }
);

/* =========================
   Start
========================= */

connect();

</script>

</body>
</html>
